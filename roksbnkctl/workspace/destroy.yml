---
# roksbnkctl workspace teardown — invoked by BNK Forge destroy.
#
# Tears down the phases that were deployed, in reverse order. An EXISTING
# (registered) cluster is NOT destroyed — only the phases roksbnkctl added.
#
# Requires the roksbnkctl state from apply (under ROKSBNKCTL_HOME, pinned into
# the module workspace). If BNK Forge does not persist the module workspace
# between apply and destroy, configure remote state so it survives — see README.
- name: Tear down the roksbnkctl workspace
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ws: "{{ workspace_name | default('forge') }}"
    cluster_create: "{{ cluster_create | default(true) }}"
    install_bnk: "{{ install_bnk | default(true) }}"
    testing_vpc: "{{ testing_vpc | default(false) }}"
    testing_in_cluster: "{{ testing_in_cluster | default(false) }}"
    install_gateway: "{{ install_gateway | default(false) }}"
    existing_transit_gateway: "{{ existing_transit_gateway | default('') }}"
    roks_home: "{{ playbook_dir }}/.roksbnkctl-home"
    seed_config: "{{ playbook_dir }}/seed-config.yaml"
  environment:
    ROKSBNKCTL_HOME: "{{ roks_home }}"
    IBMCLOUD_API_KEY: "{{ lookup('env', 'IBMCLOUD_API_KEY') }}"
  tasks:
    - name: Re-render config.yaml (in case the workspace was re-materialised)
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ seed_config }}"
        mode: "0600"

    - name: Ensure the roksbnkctl workspace exists
      ansible.builtin.command: >-
        roksbnkctl init -w {{ ws }}
        --config-file {{ seed_config }}
        --override-from-env
      args:
        creates: "{{ roks_home }}/{{ ws }}/config.yaml"

    # Reverse order: gateway → testing → bnk → cluster.
    - name: Tear down the gateway phase
      ansible.builtin.command: roksbnkctl -w {{ ws }} gateway down --auto
      when: install_gateway | bool

    - name: Tear down the testing phase
      ansible.builtin.command: roksbnkctl -w {{ ws }} testing down --auto
      when: (testing_vpc | bool) or (testing_in_cluster | bool)

    - name: Tear down BNK
      ansible.builtin.command: roksbnkctl -w {{ ws }} bnk down --auto
      when: install_bnk | bool

    # Only destroy a cluster roksbnkctl created — never an adopted existing one.
    - name: Tear down the cluster
      ansible.builtin.command: roksbnkctl -w {{ ws }} cluster down --auto
      when: cluster_create | bool
