---
# roksbnkctl workspace deploy — runs the full roksbnkctl lifecycle from a BNK
# Forge blueprint.
#
# Inputs:  the blueprint form values arrive as Ansible --extra-vars (prefix,
#          cluster_name, region, resource_group, openshift_version,
#          workers_per_zone, target).
# Secrets: IBMCLOUD_API_KEY is present in the environment, injected from the
#          project's IBM Cloud credential template by BNK Forge — never passed
#          as an extra-var, never written to config.yaml.
# State:   ROKSBNKCTL_HOME is pinned inside the module workspace so the
#          roksbnkctl state + cluster-outputs.json persist with the workspace.
# Outputs: cluster facts are written to outputs.json (the manifest's
#          deployment_pack.entrypoints.outputs_file) for BNK Forge to import.
- name: Deploy IBM ROKS + BNK with roksbnkctl
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ws: "{{ workspace_name | default('forge') }}"
    target: "{{ target | default('all') }}"
    roks_home: "{{ playbook_dir }}/.roksbnkctl-home"
    seed_config: "{{ playbook_dir }}/seed-config.yaml"
    outputs_path: "{{ playbook_dir }}/outputs.json"
  environment:
    ROKSBNKCTL_HOME: "{{ roks_home }}"
    IBMCLOUD_API_KEY: "{{ lookup('env', 'IBMCLOUD_API_KEY') }}"
  tasks:
    - name: Verify the roksbnkctl binary is on PATH
      ansible.builtin.command: roksbnkctl version
      changed_when: false

    - name: Render the workspace config.yaml from the blueprint form
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ seed_config }}"
        mode: "0600"

    - name: Initialise the roksbnkctl workspace (non-interactive)
      ansible.builtin.command: >-
        roksbnkctl init -w {{ ws }}
        --config-file {{ seed_config }}
        --override-from-env
      args:
        creates: "{{ roks_home }}/{{ ws }}/config.yaml"

    # BNK Forge "plan" maps to ansible --check. Command tasks are skipped in
    # check mode by default, so we opt this one back in to surface a real
    # `roksbnkctl plan` (read-only) without touching anything.
    - name: Plan (read-only) on a BNK Forge plan
      ansible.builtin.command: roksbnkctl -w {{ ws }} plan
      when: ansible_check_mode
      check_mode: false
      changed_when: false

    - name: Deploy the cluster phase only
      ansible.builtin.command: roksbnkctl -w {{ ws }} cluster up
      when: not ansible_check_mode and target == 'cluster'

    - name: Deploy the full lifecycle (cluster + BNK + testing + gateway)
      ansible.builtin.command: roksbnkctl -w {{ ws }} up
      when: not ansible_check_mode and target == 'all'

    - name: Read the recorded cluster outputs
      ansible.builtin.slurp:
        src: "{{ roks_home }}/{{ ws }}/cluster-outputs.json"
      register: cluster_outputs_raw
      when: not ansible_check_mode

    - name: Write the BNK Forge outputs artifact
      ansible.builtin.copy:
        dest: "{{ outputs_path }}"
        mode: "0644"
        content: >-
          {{
            {
              'cluster_id': co.cluster_id | default(''),
              'cluster_name': co.cluster_name | default(''),
              'region': co.region | default(''),
              'resource_group_id': co.resource_group_id | default(''),
              'vpc_id': co.vpc_id | default('')
            } | to_nice_json
          }}
      vars:
        co: >-
          {{ (cluster_outputs_raw.content | b64decode | from_json)
             if (cluster_outputs_raw is defined and cluster_outputs_raw.content is defined)
             else {} }}
      when: not ansible_check_mode
