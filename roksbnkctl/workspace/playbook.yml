---
# roksbnkctl workspace deploy — runs the selected roksbnkctl phases from a BNK
# Forge blueprint.
#
# Inputs (blueprint form → Ansible --extra-vars):
#   prefix, cluster_name, region, resource_group        (cluster identity)
#   cluster_create        true = provision a new ROKS cluster
#                         false = attach to an existing cluster (register)
#   openshift_version, workers_per_zone                 (new-cluster only)
#   install_bnk           install BIG-IP Next for Kubernetes
#   testing_vpc           testing: external client VPC + TGW jumphost
#   testing_in_cluster    testing: in-cluster per-AZ jumphosts
#   install_gateway       deploy the gateway phase
#
# Secrets: IBMCLOUD_API_KEY is in the environment (project IBM credential
#          template). State persists under ROKSBNKCTL_HOME inside the workspace.
# Outputs: cluster facts → outputs.json (the manifest's outputs_file).
- name: Deploy IBM ROKS + BNK with roksbnkctl
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ws: "{{ workspace_name | default('forge') }}"
    cluster_create: "{{ cluster_create | default(true) }}"
    install_bnk: "{{ install_bnk | default(true) }}"
    testing_vpc: "{{ testing_vpc | default(false) }}"
    testing_in_cluster: "{{ testing_in_cluster | default(false) }}"
    install_gateway: "{{ install_gateway | default(false) }}"
    roks_home: "{{ playbook_dir }}/.roksbnkctl-home"
    seed_config: "{{ playbook_dir }}/seed-config.yaml"
    outputs_path: "{{ playbook_dir }}/outputs.json"
  environment:
    ROKSBNKCTL_HOME: "{{ roks_home }}"
    IBMCLOUD_API_KEY: "{{ lookup('env', 'IBMCLOUD_API_KEY') }}"
  tasks:
    - name: Verify the roksbnkctl binary is on PATH
      ansible.builtin.command: roksbnkctl version
      changed_when: false

    - name: Render the workspace config.yaml from the blueprint form
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ seed_config }}"
        mode: "0600"

    - name: Initialise the roksbnkctl workspace (non-interactive)
      ansible.builtin.command: >-
        roksbnkctl init -w {{ ws }}
        --config-file {{ seed_config }}
        --override-from-env
      args:
        creates: "{{ roks_home }}/{{ ws }}/config.yaml"

    # --- Cluster phase: create OR attach to an existing cluster --------------
    - name: Provision a new ROKS cluster
      ansible.builtin.command: roksbnkctl -w {{ ws }} cluster up --auto
      when: not ansible_check_mode and (cluster_create | bool)

    - name: Register the existing ROKS cluster
      ansible.builtin.command: roksbnkctl -w {{ ws }} cluster register {{ cluster_name }}
      when: not ansible_check_mode and not (cluster_create | bool)
      # For an existing cluster whose registry COS instance has a non-default
      # name, append: --registry-cos-name <name>

    # --- Optional downstream phases (gated by the form booleans) -------------
    - name: Install BIG-IP Next for Kubernetes (BNK)
      ansible.builtin.command: roksbnkctl -w {{ ws }} bnk up --auto
      when: not ansible_check_mode and (install_bnk | bool)

    - name: Deploy the testing phase
      ansible.builtin.command: roksbnkctl -w {{ ws }} testing up --auto
      when: >-
        not ansible_check_mode and
        ((testing_vpc | bool) or (testing_in_cluster | bool))

    - name: Deploy the gateway phase
      ansible.builtin.command: roksbnkctl -w {{ ws }} gateway up --auto
      when: not ansible_check_mode and (install_gateway | bool)

    # --- Plan (read-only) on a BNK Forge plan / ansible --check --------------
    - name: Plan (read-only)
      ansible.builtin.command: roksbnkctl -w {{ ws }} plan
      when: ansible_check_mode
      check_mode: false
      changed_when: false

    # --- Outputs -------------------------------------------------------------
    - name: Read the recorded cluster outputs
      ansible.builtin.slurp:
        src: "{{ roks_home }}/{{ ws }}/cluster-outputs.json"
      register: cluster_outputs_raw
      when: not ansible_check_mode

    - name: Write the BNK Forge outputs artifact
      ansible.builtin.copy:
        dest: "{{ outputs_path }}"
        mode: "0644"
        content: >-
          {{
            {
              'cluster_id': co.cluster_id | default(''),
              'cluster_name': co.cluster_name | default(''),
              'region': co.region | default(''),
              'resource_group_id': co.resource_group_id | default(''),
              'vpc_id': co.vpc_id | default('')
            } | to_nice_json
          }}
      vars:
        co: >-
          {{ (cluster_outputs_raw.content | b64decode | from_json)
             if (cluster_outputs_raw is defined and cluster_outputs_raw.content is defined)
             else {} }}
      when: not ansible_check_mode
